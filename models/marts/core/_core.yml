version: 2

models:
  - name: dim_account
    description: "Conformed customer dimension, one row per Subskribe account enriched with HubSpot attributes."
    columns:
      - name: account_id
        description: "Primary key for the customer dimension."
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "Customer-facing company name."
      - name: crmid
        description: "HubSpot CRM id used to connect the account to company metadata."
      - name: industry
        description: "Industry classification from HubSpot."
      - name: size_grouped
        description: "Grouped company size bucket."
      - name: country
        description: "Country code."
      - name: currency
        description: "Account currency code."
      - name: created_at
        description: "Account creation timestamp."

  - name: dim_date
    description: "Standard date dimension for slicing facts by day, month, quarter, and year."
    columns:
      - name: date_key
        description: "Surrogate key for the date dimension, formatted as YYYYMMDD."
        data_tests:
          - unique
          - not_null
      - name: date_day
        description: "Calendar date."
        data_tests:
          - unique
          - not_null
      - name: year
        description: "Calendar year."
      - name: quarter
        description: "Calendar quarter."
      - name: month
        description: "Calendar month number."
      - name: day_of_month
        description: "Day of month."
      - name: day_of_week
        description: "Day of week."
      - name: week_of_year
        description: "ISO week number."
      - name: is_weekend
        description: "True when the date falls on a weekend."

  - name: fct_invoices
    description: "Transaction fact at invoice grain with one row per invoice."
    columns:
      - name: invoice_id
        description: "Primary key for the invoice fact."
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: "FK to dim_account."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: invoice_date
        description: "Invoice date."
        data_tests:
          - not_null
      - name: invoice_date_key
        description: "FK to dim_date for the invoice date, formatted as YYYYMMDD."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: subscription_id
        description: "Degenerate subscription identifier."
      - name: status
        description: "Invoice status carried as a degenerate dimension."
      - name: currency
        description: "Invoice currency code carried as a degenerate dimension."
      - name: total_nzd
        description: "Invoice total converted to NZD."
        