version: 2

models:
  - name: bdg_hubspot__company_ids
    description: "Bridge table that explodes merged_object_ids so any legacy HubSpot id resolves to its canonical company id."
    columns:
      - name: company_id
        description: "Canonical HubSpot company id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubspot__companies')
                field: company_id
      - name: merged_object_id
        description: "Canonical or legacy HubSpot object id that maps to company_id."
        data_tests:
          - not_null
          - unique

  - name: int_subscriptions__acv
    description: "One row per subscription with annual contract value derived from non-voided invoice totals."
    columns:
      - name: subscription_id
        description: "Subscription grain for the ACV calculation."
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: "Owning Subskribe account id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subskribe__accounts')
                field: account_id
      - name: acv_nzd
        description: "Annual contract value in NZD, excluding voided invoices."

  - name: int_subscriptions__renewals
    description: "One row per subscription term with renewal outcome and retained ACV calculated from the successor subscription."
    columns:
      - name: subscription_id
        description: "Subscription term being evaluated."
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: "Owning Subskribe account id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subskribe__accounts')
                field: account_id
      - name: renewed_from_subscription_id
        description: "Prior subscription id when this term is a renewal."
      - name: end_date
        description: "Term end date used to bucket the renewal outcome."
      - name: original_acv
        description: "ACV of the term that ended."
      - name: successor_acv
        description: "ACV of the successor term, when present."
      - name: retained_acv
        description: "ACV retained into the next term."
      - name: outcome
        description: "Renewal outcome classification."
        data_tests:
          - accepted_values:
              values: ['renewed', 'churned', 'in-progress']
